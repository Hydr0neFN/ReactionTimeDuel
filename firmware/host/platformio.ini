; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit http://docs.platformio.org/page/projectconf.html
;
; FLASH LAYOUT (OTA): two 1.25 MB application slots and a 1.375 MB SPIFFS that
; holds the 24 MP3 files and the joystick firmware image (DESIGN.md 9.4).

[platformio]
; Shared build cache across all projects (major speedup on rebuilds)
build_cache_dir = ~/.platformio/build_cache

[env:esp32doit-devkit-v1]
platform = espressif32@6.9.0
board = esp32doit-devkit-v1
framework = arduino
board_build.f_cpu = 240000000L     ; 240MHz (max speed)
board_build.partitions = partitions.csv

; Build speed optimizations
build_flags =
    -O2                            ; Optimize for speed

; Use ccache for faster rebuilds (requires ccache installed)
extra_scripts =
    pre:enable_ccache.py
    post:../../tools/pio_ota.py
; pio run -d firmware/host -t ota  (PC on the Wi-Fi RTD-Host, host in update mode)
custom_ota_kind = host

; Faster library dependency finder (chain mode is faster than deep)
lib_ldf_mode = chain+

; Faster upload speed
upload_speed = 921600
monitor_speed = 115200

lib_extra_dirs = ../../shared

lib_deps =
    rtd_core
    earlephilhower/ESP8266Audio@1.9.7
    makuna/NeoPixelBus@^2.8.3
