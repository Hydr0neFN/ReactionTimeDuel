; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit http://docs.platformio.org/page/projectconf.html
;
; ENVIRONMENTS:
;   stick1..stick4 - USB flash of one physical stick, writes its ID to EEPROM
;   stick          - the single OTA image for all four sticks (reads the ID from EEPROM)
;
; FLASH LAYOUT (OTA): eagle.flash.4m2m.ld = 4 MB flash, 2 MB OTA-usable code area
; split into two 1 MB slots, 2 MB SPIFFS (unused by the stick). The sketch must
; stay below 1 MB, i.e. below half of the OTA-usable flash.

[platformio]
; Shared build cache across all projects (major speedup on rebuilds)
build_cache_dir = ~/.platformio/build_cache
; One image for all four sticks, updated over the air
default_envs = stick

; Common settings for all joysticks
[env]
platform = espressif8266@4.2.1
board = esp12e
framework = arduino
board_build.f_cpu = 160000000L  ; 160MHz (double default 80MHz)
board_build.ldscript = eagle.flash.4m2m.ld  ; two 1MB OTA slots
extra_scripts =
    pre:enable_ccache.py
    post:../../tools/pio_ota.py
lib_ldf_mode = chain+
lib_extra_dirs = ../../shared
lib_deps = rtd_core
upload_speed = 921600
monitor_speed = 115200

; OTA image: no MY_ID, the stick reads its ID from EEPROM
[env:stick]
; pio run -d firmware/joystick -e stick -t ota  (stores the image in the host and starts the stick update)
custom_ota_kind = sticks
build_flags =
    -O2

; Joystick 1 (ID_STICK1 = 0x01)
[env:stick1]
build_flags =
    -O2
    -DMY_ID=0x01

; Joystick 2 (ID_STICK2 = 0x02)
[env:stick2]
build_flags =
    -O2
    -DMY_ID=0x02

; Joystick 3 (ID_STICK3 = 0x03)
[env:stick3]
build_flags =
    -O2
    -DMY_ID=0x03

; Joystick 4 (ID_STICK4 = 0x04)
[env:stick4]
build_flags =
    -O2
    -DMY_ID=0x04
