; Reaction Time Duel 2.0 display (ESP32-S3, ESP-IDF, LVGL 8.3). DESIGN.md section 7 and 9.5.
; Build from PowerShell on Windows: pio run -d firmware/display

[env:esp32s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = espidf
board_build.partitions = partitions.csv

monitor_speed = 115200
build_type = release
monitor_filters = esp32_exception_decoder
upload_speed = 921600

; pio run -d firmware/display -t ota  (PC on the Wi-Fi RTD-Host, host in update mode)
extra_scripts = post:../../tools/pio_ota.py
custom_ota_kind = display

lib_extra_dirs = ../../shared

lib_deps =
    lvgl/lvgl@8.3.11
    rtd_core

; lv_conf.h lives in lib/. LV_CONF_PATH is not used: its backslashes get lost on Windows.
; Anti-tearing mode 3 (2 frame buffers, LVGL direct mode): only the changed areas are drawn, and each frame is
; shown on a panel vsync (39 Hz at 16 MHz). Mode 2 (3 frame buffers, full refresh) drew the full screen for each
; frame; set it again when mode 3 shows artifacts.
; The refresh period is below the vsync period (25.6 ms), so a frame that is ready goes out on the next vsync.
build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -Ilib
    -DCONFIG_EXAMPLE_LVGL_PORT_AVOID_TEAR_MODE=3
    -DLV_DISP_DEF_REFR_PERIOD=10
    -DCONFIG_EXAMPLE_LVGL_PORT_TASK_MIN_DELAY_MS=2
    -DCONFIG_EXAMPLE_LVGL_PORT_TASK_STACK_SIZE_KB=8
